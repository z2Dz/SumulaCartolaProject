<head>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<body>
    <div id="app">
        <div style="display:flex;height:100vh;align-items:center;justify-content:center;background:#0b3d2e;color:#fff;font-family:sans-serif">
            Carregando…
        </div>
    </div>
    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
                                // Guarda o aviso de instalação do navegador para o pop-up usar depois do login
                                var __instalarEvento = null;
                                window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); __instalarEvento = e; });
                                window.addEventListener('appinstalled', function () { __instalarEvento = null; localStorage.setItem('app-instalado', '1'); });
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
                // Atualização do app instalado: a versão nova assume sozinha (skipWaiting no service worker)
                // e, se isso acontecer logo ao abrir, a página recarrega uma vez para já mostrar a versão nova.
                // Depois de alguns segundos não recarrega, para não derrubar uma súmula em edição: vale na próxima abertura.
                if ('serviceWorker' in navigator) {
                    var __jaTinhaControle = !!navigator.serviceWorker.controller;
                    var __inicio = Date.now();
                    var __recarregou = false;
                    navigator.serviceWorker.addEventListener('controllerchange', function () {
                        if (!__jaTinhaControle || __recarregou || Date.now() - __inicio > 15000) return;
                        __recarregou = true;
                        location.reload();
                    });
                    navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                        .then(function (reg) { reg.update(); });
                }
    </script>
</body>
</html>
